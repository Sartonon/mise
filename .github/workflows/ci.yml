name: CI

# When to run: on pushes to main, and on every pull request.
# (Pull request branches aren't listed under `push` too, or each push would run CI twice.)
on:
  push:
    branches: [main]
  pull_request:

# The workflow's GitHub token may only read the repo. Safer if a dependency misbehaves.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version named in package.json's `packageManager`.
      - uses: pnpm/action-setup@v6

      # Installs the Node version from .nvmrc, and caches pnpm's store
      # (keyed on pnpm-lock.yaml) so later runs download less.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Install exactly what the lockfile says. If package.json and the
      # lockfile disagree, fail instead of quietly updating the lockfile.
      - id: install
        run: pnpm install --frozen-lockfile

      # DEMO, do not merge: borrowed from #23 (step 19b). Without these `if:`s, the first failing
      # check (lint) would skip the rest, and Knip would never get to report.
      # Fails if any file contains something that looks like a secret (token, key, password).
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint:secrets
      # Fails if any file isn't formatted the way Prettier would format it.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      # Fails on unused files, exports and dependencies, and on imports of undeclared packages.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      # Fails if the app doesn't compile for production (client and server bundles).
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

  # End-to-end tests in a real browser. A separate job, so it runs in parallel with `check`
  # and shows up as its own check on the pull request.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Download Chromium, plus the Linux libraries it needs (--with-deps).
      # The browser version must match @playwright/test, so it isn't cached separately.
      - run: pnpm exec playwright install --with-deps chromium

      # Builds the app, starts it, and runs the tests (see webServer in playwright.config.ts).
      - run: pnpm test:e2e

      # If a test failed, keep the HTML report (with traces) so it can be downloaded
      # from the run's summary page and opened with `pnpm exec playwright show-report`.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
