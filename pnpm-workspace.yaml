# pnpm 11 reads its settings from this file (.npmrc is only for auth/registry).
# This repo is a single package, so there is no `packages:` list.

# Refuse to install dependencies whose `engines` say they don't support our Node.
engineStrict: true

# pnpm 11 doesn't run dependencies' install scripts unless they're listed here.
# esbuild (used by drizzle-kit and tsx) gets its binary from a platform package
# (@esbuild/linux-x64 and so on), which pnpm installs as an optional dependency.
# Its install script is a backup for when that's not enough: it honours
# ESBUILD_BINARY_PATH, downloads the binary if the platform package is missing, and
# swaps the JavaScript wrapper for the binary itself so it starts faster. We use none
# of that, so it stays off. If esbuild ever says its binary is missing, allow it.
allowBuilds:
  esbuild: false
