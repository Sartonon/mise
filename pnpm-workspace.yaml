# pnpm 11 reads its settings from this file (.npmrc is only for auth/registry).
# This repo is a single package, so there is no `packages:` list.

# Refuse to install dependencies whose `engines` say they don't support our Node.
engineStrict: true

# Packages whose install scripts may run (pnpm 11 asks about each one).
# esbuild (used by drizzle-kit and the TanStack build) only checks its binary in its script; pnpm already
# installs the binary as an optional package (@esbuild/linux-x64 and so on), so: no.
allowBuilds:
  esbuild: false
